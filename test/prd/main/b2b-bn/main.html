    <style>
      :root {
        --brand-red: #ff3b30;
        --brand-dark: #0f1218;
        --surface: #161b23;
        --surface-soft: #1f2631;
        --text-main: #f4f7fb;
        --text-sub: #b9c4d6;
        --line: #2f3947;
        --highlight: #ffd166;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Noto Sans KR', sans-serif;
      }

      body {
        min-height: 100vh;
        color: var(--text-main);
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 59, 48, 0.28), transparent 38%),
          radial-gradient(circle at 78% 10%, rgba(74, 134, 232, 0.22), transparent 35%),
          linear-gradient(140deg, #0b0e13 0%, #101621 45%, #151a22 100%);
      }

      header {
        width: 100%;
        text-align: center;
        font-family: 'Montserrat', sans-serif;
        font-size: clamp(0.75rem, 0.3rem + 1vw, 1rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #d8e2f0;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        background: rgba(9, 12, 18, 0.78);
      }

      #container {
        width: min(1200px, 92%);
        margin: 0 auto;
        padding: clamp(1.5rem, 1rem + 2.5vw, 3rem) 0;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background:
          linear-gradient(125deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01)),
          linear-gradient(165deg, #141a23 0%, #0f141c 100%);
        padding: clamp(1.4rem, 0.8rem + 2.5vw, 3rem);
        display: block;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        isolation: isolate;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(3px);
        z-index: -1;
      }

      .hero::before {
        width: 360px;
        height: 360px;
        right: -120px;
        top: -130px;
        background: radial-gradient(circle, rgba(255, 59, 48, 0.4), transparent 70%);
      }

      .hero::after {
        width: 340px;
        height: 340px;
        left: -130px;
        bottom: -180px;
        background: radial-gradient(circle, rgba(51, 114, 216, 0.3), transparent 72%);
      }

      .hero__content,
      .hero__visual {
        opacity: 0;
        transform: translateY(12px);
        animation: riseIn 0.7s ease forwards;
      }

      .hero__visual {
        animation-delay: 0.16s;
        margin: 1.2rem 0 1.4rem;
      }

      .hero__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.42rem 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        font-family: 'Montserrat', sans-serif;
        font-size: clamp(0.62rem, 0.5rem + 0.4vw, 0.75rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #d7e0ec;
      }

      .hero__eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--highlight);
        box-shadow: 0 0 0 8px rgba(255, 209, 102, 0.18);
      }

      .hero__logo {
        width: clamp(120px, 12vw, 160px);
        margin: 1rem 0 1.1rem;
      }

      .hero h1 {
        font-size: clamp(1.55rem, 1.05rem + 2vw, 3rem);
        line-height: 1.2;
        margin-bottom: 0.7rem;
        letter-spacing: -0.02em;
      }

      .hero__desc {
        color: var(--text-sub);
        font-size: clamp(0.96rem, 0.86rem + 0.35vw, 1.15rem);
        line-height: 1.7;
        margin-bottom: 1.2rem;
      }

      .hero__benefits {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
        margin-bottom: 1.35rem;
      }

      .hero__benefits article {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, #1d2430, #181e28);
        padding: 0.9rem 0.95rem;
      }

      .hero__benefits h3 {
        font-size: clamp(0.82rem, 0.66rem + 0.3vw, 0.95rem);
        color: #ffe5e3;
        margin-bottom: 0.38rem;
      }

      .hero__benefits p {
        font-size: clamp(0.9rem, 0.82rem + 0.2vw, 1rem);
        color: #f2f6ff;
        font-weight: 500;
      }

      .hero__actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1.15rem;
      }

      .cta-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-width: 165px;
        border-radius: 12px;
        border: 0;
        padding: 0.84rem 1.25rem;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(135deg, #ff5b4a 0%, #e4362a 100%);
        box-shadow: 0 12px 28px rgba(228, 54, 42, 0.32);
        transition: transform 0.22s ease, box-shadow 0.22s ease;
      }

      .cta-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 32px rgba(228, 54, 42, 0.42);
      }

      .hero__subline {
        color: #dce6f6;
        font-size: clamp(0.92rem, 0.83rem + 0.22vw, 1rem);
        margin-bottom: 1rem;
      }

      .contact-list {
        display: grid;
        gap: 0.58rem;
        list-style: none;
      }

      .contact-list li {
        display: flex;
        align-items: center;
        gap: 0.58rem;
        color: #dee8f8;
        font-size: clamp(0.88rem, 0.75rem + 0.3vw, 0.98rem);
      }

      .contact-list i {
        width: 1.25rem;
        color: #ff9b94;
      }

      .hero__visual {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero__visual-card {
        width: 100%;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: linear-gradient(165deg, #0d121a, #141a24);
        box-shadow: 0 26px 48px rgba(0, 0, 0, 0.4);
      }

      .hero__visual-card img {
        width: 100%;
        display: block;
        object-fit: cover;
      }

      .hero__visual-caption {
        font-size: 0.84rem;
        letter-spacing: 0.03em;
        color: #aab6c7;
        padding: 0.7rem 0.9rem 0.95rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      @keyframes riseIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .hero {
          border-radius: 22px;
        }
      }

      @media (max-width: 640px) {
        #container {
          width: 94%;
        }

        .hero {
          padding: 1.15rem;
        }

        .hero__benefits {
          grid-template-columns: 1fr;
        }

        .cta-btn {
          width: 100%;
        }
      }
    </style>
    
<!-- /head -->

          <li><i class="fa-solid fa-globe"></i>www.sodamedia.co.kr</li>
        </ul>
      </div>
    </section>
  </div>
