<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴무 달력</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    
    .calendar-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .calendar-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }
    
    .week-container {
      margin-bottom: 30px;
    }
    
    .week-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #555;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
    }
    
    .calendar-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .day-header {
      background-color: #4a90e2;
      color: white;
      text-align: center;
      padding: 10px 5px;
      font-weight: bold;
      font-size: 14px;
    }
    
    .day {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      padding: 15px 5px;
      text-align: center;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    
    .day-number {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .day-info {
      font-size: 12px;
      line-height: 1.2;
    }
    
    .sunday {
      color: #e74c3c;
    }
    
    .saturday {
      color: #3498db;
    }
    
    .holiday {
      background-color: #ffe6e6 !important;
      color: #e74c3c !important;
    }
    
    .holiday .day-number {
      color: #e74c3c;
    }
    
    .holiday .day-info {
      color: #c0392b;
      font-weight: bold;
    }
    
    .vacation {
      background-color: #fff3cd !important;
      color: #856404 !important;
    }
    
    .vacation .day-number {
      color: #856404;
    }
    
    .vacation .day-info {
      color: #856404;
      font-weight: bold;
    }
    
    .other-month {
      background-color: #f8f9fa;
      color: #6c757d;
    }
    
    .legend {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 8px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    
    .legend-holiday {
      background-color: #ffe6e6;
    }
    
    .legend-vacation {
      background-color: #fff3cd;
    }
  </style>
</head>
<body>
  <div class="calendar-container">
    <div class="calendar-title">소다미디어 광복절 배송 안내</div>
      <div>
        <h1 style="text-align: center;">
          2026.8
        </h1>
      <p style="text-align: center;">2026년 8월 17일은 휴무입니다.</p>
      </div>
    <div class="week-container">
      <div class="calendar-week">
        <div class="day-header">일</div>
        <div class="day-header">월</div>
        <div class="day-header">화</div>
        <div class="day-header">수</div>
        <div class="day-header">목</div>
        <div class="day-header">금</div>
        <div class="day-header">토</div>
        
        <div class="day sunday">
          <div class="day-number">9</div>
          <div class="day-info"></div>
        </div>
        <div class="day">
          <div class="day-number">10</div>
          <div class="day-info"></div>
        </div>
        <div class="day">
          <div class="day-number">11</div>
          <div class="day-info"></div>
        </div>
        <div class="day">
          <div class="day-number">12</div>
          <div class="day-info"></div>
        </div>
        <div class="day">
          <div class="day-number">13</div>
          <div class="day-info"></div>
        </div>
        <div class="day vacation">
          <div class="day-number">14</div>
          <div class="day-info">배송 출고 마감</div>
        </div>
        <div class="day saturday">
          <div class="day-number">15</div>
          <div class="day-info">광복절</div>
        </div>
        <div class="day sunday">
          <div class="day-number">16</div>
          <div class="day-info"></div>
        </div>
        <div class="day holiday">
          <div class="day-number">17</div>
          <div class="day-info">광복절<br>대체 휴일</div>
        </div>
        <div class="day vacation">
          <div class="day-number">18</div>
          <div class="day-info"><br>배송 순차 출고</div>
        </div>
        <div class="day">
          <div class="day-number">19</div>
          <div class="day-info"><br></div>
        </div>
        <div class="day">
          <div class="day-number">20</div>
          <div class="day-info"><br></div>
        </div>
        <div class="day">
          <div class="day-number">21</div>
          <div class="day-info"><br></div>
        </div>
        <div class="day saturday">
          <div class="day-number">22</div>
          <div class="day-info"></div>
        </div>
      </div>
    </div>
    
    <!-- 범례 -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color legend-holiday"></div>
        <span>휴무일 (광복절, 대체 휴일)</span>
      </div>
    </div>
  </div>
</body>
</html>
